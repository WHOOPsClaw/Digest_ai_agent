[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsbrief"
version = "0.1.0-dev"
description = "Self-hosted AI-powered news digest for Telegram"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "newsbrief contributors"}]
requires-python = ">=3.11"
keywords = ["news", "digest", "telegram", "ai", "rss", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "feedparser>=6.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rich>=13.7",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "python-dateutil>=2.8",
    "tzdata",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
newsbrief = "newsbrief.cli:main"

[project.urls]
Homepage = "https://github.com/newsbrief/newsbrief"
Repository = "https://github.com/newsbrief/newsbrief"

[tool.setuptools.packages.find]
where = ["."]
include = ["newsbrief*"]

[tool.setuptools.package-data]
newsbrief = ["llm/presets.yaml", "data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F401", "F811"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
