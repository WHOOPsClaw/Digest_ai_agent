name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check newsbrief/
      - name: Tests
        run: pytest tests/ -v --cov=newsbrief --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: matrix.python == '3.12'
